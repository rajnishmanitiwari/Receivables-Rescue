name: Restore reviewed DueRise staging tree
on:
  push:
    branches: [duerise-reviewed-upgrade]
    paths: [.github/workflows/duerise-publication.yml]
permissions:
  contents: write
concurrency:
  group: duerise-reviewed-publication
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'rajnishmanitiwari/Receivables-Rescue' && github.ref == 'refs/heads/duerise-reviewed-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restore reviewed bytes on staging only
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_BUNDLE: 
        shell: python
        run: |
          import os,base64,pathlib,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='rajnishmanitiwari/Receivables-Rescue'
          assert os.environ['GITHUB_REF']=='refs/heads/duerise-reviewed-upgrade'
          assert os.environ['GITHUB_EVENT_NAME']=='push'
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','clone','--branch','duerise-reviewed-upgrade','https://github.com/rajnishmanitiwari/Receivables-Rescue.git','work'],check=True)
          os.chdir('work')
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          wf=pathlib.Path('.github/workflows/duerise-publication.yml')
          workflow=wf.read_bytes()
          pathlib.Path('/tmp/reviewed.bundle').write_bytes(base64.b64decode(os.environ['REVIEWED_BUNDLE'],validate=True))
          git('bundle','verify','/tmp/reviewed.bundle')
          git('fetch','/tmp/reviewed.bundle','HEAD:refs/reviewed/source')
          assert git('rev-parse','refs/reviewed/source')=='8e5cbac2e61309bc3d228f1fd4fd23af86995b97'
          git('read-tree','--reset','-u','refs/reviewed/source')
          wf.parent.mkdir(parents=True,exist_ok=True)
          wf.write_bytes(workflow)
          git('add',str(wf))
          assert git('diff','--cached','--name-only','refs/reviewed/source')==str(wf)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','Restore exact reviewed DueRise source and typography')
          assert git('diff','--name-only','refs/reviewed/source','HEAD')==str(wf)
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:refs/heads/duerise-reviewed-upgrade'],check=True)
          print('Reviewed product tree restored on staging; temporary workflow remains for UI removal.')
# End of temporary publication workflow
